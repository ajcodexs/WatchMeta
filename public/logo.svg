<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueTri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleTri1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleTri2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkTri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="400" height="300" fill="#000000"/>

  <!-- Film Strip (Left side) -->
  <g>
    <!-- Main strip body -->
    <rect x="12" y="30" width="45" height="240" rx="3" fill="url(#filmGrad)" />
    
    <!-- Film perforations (left side) -->
    <rect x="16" y="40" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="60" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="80" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="100" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="120" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="140" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="160" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="180" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="200" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="220" width="8" height="11" fill="#0a0e27" />
    <rect x="16" y="240" width="8" height="11" fill="#0a0e27" />
    
    <!-- Film perforations (right side) -->
    <rect x="41" y="40" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="60" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="80" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="100" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="120" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="140" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="160" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="180" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="200" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="220" width="8" height="11" fill="#0a0e27" />
    <rect x="41" y="240" width="8" height="11" fill="#0a0e27" />
  </g>

  <!-- Play Button Triangles -->
  <g>
    <!-- Large left/center blue triangle - main play button -->
    <polygon points="70,80 70,220 200,150" fill="url(#blueTri)" />
    
    <!-- Top right purple/magenta triangle -->
    <polygon points="200,80 280,30 240,130" fill="url(#purpleTri1)" />
    
    <!-- Bottom right purple triangle -->
    <polygon points="200,150 240,130 300,200" fill="url(#purpleTri2)" />
    
    <!-- Dark center triangle (shadow/depth) -->
    <polygon points="200,80 200,150 240,130" fill="url(#darkTri)" opacity="0.8" />
  </g>

  <!-- Circuit Board Elements (Right side) -->
  <g>
    <!-- Top connection line 1 -->
    <line x1="280" y1="80" x2="320" y2="80" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="280" cy="80" r="4" fill="#0ea5e9" />
    <circle cx="320" cy="80" r="5" fill="#a855f7" />

    <!-- Connection line 2 -->
    <line x1="290" y1="110" x2="310" y2="130" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="310" y1="130" x2="345" y2="130" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="290" cy="110" r="4" fill="#0ea5e9" />
    <circle cx="345" cy="130" r="5" fill="#a855f7" />

    <!-- Connection line 3 -->
    <line x1="285" y1="150" x2="320" y2="170" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="320" y1="170" x2="355" y2="170" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="285" cy="150" r="4" fill="#0ea5e9" />
    <circle cx="355" cy="170" r="5" fill="#a855f7" />

    <!-- Connection line 4 -->
    <line x1="280" y1="185" x2="310" y2="210" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="310" y1="210" x2="350" y2="210" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="280" cy="185" r="4" fill="#0ea5e9" />
    <circle cx="350" cy="210" r="5" fill="#a855f7" />
  </g>
</svg>