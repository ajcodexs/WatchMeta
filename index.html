<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (() => {
      const stored = localStorage.getItem('watchmeta-theme');
      const theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/watchmeta.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async defer></script>
  <script>
    function onTurnstileLoad() {
      window._turnstileReady = true;
      window.dispatchEvent(new Event('turnstile-ready'));
    }
  </script>

  <!-- Web App / PWA -->
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WatchMeta" />
  <link rel="apple-touch-icon" href="/watchmeta.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Primary SEO -->
  <title>WatchMeta — Free Movie &amp; TV Show Streaming | Watch Online</title>
  <meta name="description"
    content="WatchMeta is a free streaming platform to watch movies and TV shows online. Discover trending titles, browse by genre, and stream instantly — no sign-up required." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="keywords"
    content="watchmeta, WatchMeta, free streaming, watch movies online, watch TV shows online, free movie streaming, trending movies, best TV series, WatchMeta app" />
  <meta name="author" content="WatchMeta" />
  <meta name="application-name" content="WatchMeta" />
  <link rel="canonical" href="https://watchmeta.site/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WatchMeta" />
  <meta property="og:url" content="https://watchmeta.site/" />
  <meta property="og:title" content="WatchMeta — Free Movie &amp; TV Show Streaming" />
  <meta property="og:description"
    content="WatchMeta is a free streaming platform. Watch movies and TV shows online instantly — no subscription needed." />
  <meta property="og:image" content="https://watchmeta.site/watchmeta.png" />
  <meta property="og:image:alt" content="WatchMeta — Free Movie &amp; TV Show Streaming" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@watchmeta" />
  <meta name="twitter:creator" content="@watchmeta" />
  <meta name="twitter:title" content="WatchMeta — Free Movie &amp; TV Show Streaming" />
  <meta name="twitter:description"
    content="WatchMeta is a free streaming platform. Watch movies and TV shows online instantly — no subscription needed." />
  <meta name="twitter:image" content="https://watchmeta.site/watchmeta.png" />
  <meta name="twitter:image:alt" content="WatchMeta — Free Movie &amp; TV Show Streaming" />

  <!-- JSON-LD: WebSite schema with Sitelinks Searchbox -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://watchmeta.site/#website",
      "name": "WatchMeta",
      "alternateName": ["WatchMeta App", "watchmeta"],
      "url": "https://watchmeta.site/",
      "description": "WatchMeta is a free online streaming platform to watch movies and TV shows instantly.",
      "inLanguage": "en-US",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://watchmeta.site/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <!-- JSON-LD: Organization (Brand Entity) -->

      "@context": "https://schema.org",
